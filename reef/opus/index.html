<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1aa7b8">
<title>Reef Lagoon</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#2fb7c4;touch-action:none;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#gl{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none;outline:none}
.glass{background:rgba(6,72,96,.26);border:1px solid rgba(255,255,255,.34);
  -webkit-backdrop-filter:blur(14px) saturate(1.45);backdrop-filter:blur(14px) saturate(1.45);
  box-shadow:0 8px 30px rgba(0,40,70,.20),inset 0 1px 0 rgba(255,255,255,.35)}
#plate{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));
  padding:9px 16px 9px 14px;border-radius:16px;color:#fff;text-shadow:0 1px 3px rgba(0,50,70,.45);
  transition:opacity .35s;pointer-events:none;z-index:5}
#plate h1{margin:0;font-size:19px;font-weight:750;letter-spacing:.02em;line-height:1.15}
#plate .count{font-size:12.5px;opacity:.92;margin-top:2px;font-variant-numeric:tabular-nums}
#dock{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;padding:8px;border-radius:22px;box-sizing:border-box;
  max-width:calc(100vw - 16px);transition:opacity .35s,transform .35s;z-index:6}
#cards{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;min-width:0;-webkit-overflow-scrolling:touch}
#cards::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 auto;width:98px;padding:4px 4px 6px;border-radius:14px;border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.12);color:#fff;cursor:grab;touch-action:none;text-align:center;font:inherit;
  display:flex;flex-direction:column;align-items:center;gap:1px;box-sizing:border-box;transition:background .15s,transform .15s}
.card:hover{background:rgba(255,255,255,.26)}
.card:active{transform:scale(.96);cursor:grabbing}
.card.dis{opacity:.45}
.card img{width:90px;height:54px;object-fit:contain;pointer-events:none;-webkit-user-drag:none;
  filter:drop-shadow(0 4px 4px rgba(0,40,60,.35))}
.card .ph{width:90px;height:54px}
.card .nm{font-size:12px;font-weight:700;text-shadow:0 1px 2px rgba(0,50,70,.5);white-space:nowrap}
.card .ds{font-size:10.5px;opacity:.9;line-height:1.15;text-shadow:0 1px 2px rgba(0,50,70,.5);white-space:nowrap}
.card .k{position:absolute;right:6px;top:4px;font-size:9.5px;opacity:.7}
.short{display:none}
#tools{display:grid;grid-template-columns:repeat(3,auto);gap:5px;align-content:center;flex:0 0 auto}
.tool{font:inherit;font-size:12px;font-weight:650;color:#fff;padding:7px 10px;border-radius:11px;cursor:pointer;
  border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);text-shadow:0 1px 2px rgba(0,50,70,.45);white-space:nowrap}
.tool:hover{background:rgba(255,255,255,.26)}
.tool.on{background:rgba(255,255,255,.62);color:#05506a;text-shadow:none}
#toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translate(-50%,-14px);opacity:0;
  padding:9px 16px;border-radius:14px;color:#fff;font-size:13.5px;font-weight:600;pointer-events:none;transition:opacity .25s,transform .25s;
  z-index:20;max-width:calc(100vw - 40px);text-align:center;text-shadow:0 1px 2px rgba(0,40,60,.5);background:rgba(10,70,90,.38)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dockh,120px) + 14px);color:#fff;font-size:12.5px;
  opacity:.9;text-shadow:0 1px 3px rgba(0,50,70,.6);white-space:nowrap;pointer-events:none;transition:opacity .6s;z-index:4}
#showui{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:none;z-index:7}
body.hideui #dock,body.hideui #plate,body.hideui #hint{opacity:0;pointer-events:none}
body.hideui #dock{transform:translate(-50%,30px)}
body.hideui #showui{display:block}
@media (max-width:860px){
  #dock{flex-direction:column;align-items:stretch;width:calc(100vw - 16px);gap:6px;padding:6px;border-radius:18px}
  #tools{grid-template-columns:repeat(6,1fr);gap:4px}
  .tool{padding:6px 2px;font-size:11px;text-align:center}
  #cards{justify-content:flex-start}
  #cards{gap:4px}
  .card{flex:1 1 0;min-width:0;width:auto;padding:3px 1px 4px;border-radius:12px}
  .card img,.card .ph{width:100%;max-width:64px;height:36px}
  .card .nm{font-size:10.5px;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .card .ds,.card .k,.long{display:none}
  .short{display:inline}
  #hint{font-size:11.5px;white-space:normal;width:86vw;text-align:center}
}
@media (max-width:480px){.card img,.card .ph{height:30px}.card .nm{font-size:9.5px}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<div id="plate" class="glass"><h1>Reef Lagoon</h1><div class="count" id="count">0 creatures</div></div>
<div id="hint">Tap a card to throw · drag a card to aim · grab creatures and fling them · tap the water</div>
<div id="dock" class="glass">
  <div id="cards"></div>
  <div id="tools">
    <button class="tool" data-t="rain" title="Rain (R)">Rain</button>
    <button class="tool" data-t="whirl" title="Whirlpool (W)">Whirlpool</button>
    <button class="tool" data-t="calm" title="Calm (C)">Calm</button>
    <button class="tool" data-t="clear" title="Clear (X)">Clear</button>
    <button class="tool on" data-t="sound" title="Sound (M)">Sound</button>
    <button class="tool" data-t="hide" title="Hide UI (H)">Hide UI</button>
  </div>
</div>
<button id="showui" class="tool glass">Show UI</button>
<div id="toast" class="glass"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* ====================================================================== *
 *  Basics: toast, error reporting, helpers
 * ====================================================================== */
const $ = s => document.querySelector(s);
const toastEl = $('#toast'); let toastTimer = 0;
function toast(msg, ms){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2200);
}
let errCount = 0;
window.addEventListener('error', e => { if (errCount++ < 6) toast('Runtime error: ' + (e.message || e), 5000); });
window.addEventListener('unhandledrejection', e => { if (errCount++ < 6) toast('Runtime error: ' + ((e.reason && e.reason.message) || e.reason), 5000); });
if (!window.THREE) { toast('Could not load Three.js — check your connection', 10000); return; }

const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const smoother = t => { t = clamp(t, 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); };
const rand = (a, b) => a + Math.random() * (b - a);
const wrapA = a => { while (a > PI) a -= TAU; while (a < -PI) a += TAU; return a; };
function hash2(x, y) { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y) { let s = 0, a = 0.5; for (let i = 0; i < 4; i++) { s += a * vnoise(x, y); x = x * 2.03 + 17.1; y = y * 2.01 - 9.3; a *= 0.5; } return s / 0.9375; }

/* ====================================================================== *
 *  Renderer & capabilities
 * ====================================================================== */
const canvas = $('#gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
} catch (e) { toast('WebGL is not available on this device', 12000); return; }
const gl = renderer.getContext();
const isGL2 = renderer.capabilities.isWebGL2;
renderer.autoClear = false;
renderer.setClearColor(0x000000, 0);
const VTF = renderer.capabilities.maxVertexTextures > 0;
const hasMinMax = isGL2 || !!renderer.extensions.get('EXT_blend_minmax');
let running = true;
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); running = false; toast('WebGL context lost — trying to restore…', 8000); }, false);
canvas.addEventListener('webglcontextrestored', () => { toast('WebGL context restored — reloading', 3000); setTimeout(() => location.reload(), 600); }, false);

function pickSimType() {
  const cands = [THREE.HalfFloatType, THREE.FloatType];
  for (const t of cands) {
    if (!isGL2) {
      if (t === THREE.HalfFloatType && !renderer.extensions.get('OES_texture_half_float')) continue;
      if (t === THREE.FloatType && !renderer.extensions.get('OES_texture_float')) continue;
    } else if (!renderer.extensions.get('EXT_color_buffer_float') && !renderer.extensions.get('EXT_color_buffer_half_float')) continue;
    let ok = false;
    try {
      const rt = new THREE.WebGLRenderTarget(4, 4, { type: t, format: THREE.RGBAFormat, depthBuffer: false, stencilBuffer: false,
        minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
      renderer.setRenderTarget(rt);
      ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
      renderer.setRenderTarget(null); rt.dispose();
    } catch (e) { ok = false; }
    if (ok) return t;
  }
  return THREE.UnsignedByteType;
}
const simType = pickSimType();
if (simType === THREE.UnsignedByteType) setTimeout(() => toast('Float textures unavailable — ripples will be limited', 4000), 800);
const simLinear = simType === THREE.HalfFloatType
  ? (isGL2 || !!renderer.extensions.get('OES_texture_half_float_linear'))
  : !!renderer.extensions.get('OES_texture_float_linear');

/* ====================================================================== *
 *  View / camera
 * ====================================================================== */
const camera = new THREE.PerspectiveCamera(36, 1, 1, 80);
camera.position.set(0, 26, 0); camera.up.set(0, 0, -1); camera.lookAt(0, 0, 0);
const VIEW = { W: 1, H: 1, aspect: 1, halfX: 8.4, halfZ: 8.4, dpr: 1, maxDpr: 1, dockPx: 120, pxScale: 1 };
const SUN = new THREE.Vector3(-0.42, 0.84, 0.34).normalize();
const SUNW = (() => { const s = new THREE.Vector3(SUN.x / 1.333, 0, SUN.z / 1.333); s.y = Math.sqrt(1 - s.x * s.x - s.z * s.z); return s; })();

function computeView() {
  VIEW.W = Math.max(1, window.innerWidth); VIEW.H = Math.max(1, window.innerHeight);
  VIEW.aspect = VIEW.W / VIEW.H;
  if (VIEW.aspect >= 1) { VIEW.halfZ = 8.4; VIEW.halfX = 8.4 * VIEW.aspect; }
  else { VIEW.halfX = 8.4; VIEW.halfZ = 8.4 / VIEW.aspect; }
  camera.aspect = VIEW.aspect;
  camera.fov = 2 * Math.atan(VIEW.halfZ / 26) * 180 / PI;
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
}

/* ---------------- floor height (shared by mesh + behaviour) ---------------- */
function floorBase(x, z) {
  const t = clamp(0.5 - z / (2 * VIEW.halfZ), 0, 1);
  let d = 1.35 + 2.95 * (t * 0.85 + 0.15 * t * t);
  d += 0.16 * Math.sin(x * 0.42 + 0.7) * Math.cos(z * 0.31 + 1.1) + 0.22 * (fbm(x * 0.11 + 3.3, z * 0.11 - 1.7) - 0.5);
  return d;
}
function coralMask(x, z) {
  const f = fbm(x * 0.17 + 11.3, z * 0.17 + 4.1);
  return [smooth(0.60, 0.72, f), smooth(0.50, 0.60, f) * (1 - smooth(0.6, 0.7, f)), f];
}
function floorY(x, z) {
  let h = -floorBase(x, z);
  const cm = coralMask(x, z), m = cm[0];
  if (m > 0) {
    h += m * (1.0 + 0.4 * vnoise(x * 0.6 + 2, z * 0.6 - 5)) + m * 0.12 * (vnoise(x * 3.1, z * 3.1) - 0.5);
    h = Math.min(h, -0.5 - 0.12 * vnoise(x * 2.0, z * 2.0));
  }
  h += cm[1] * 0.07 * vnoise(x * 5, z * 5);
  return h;
}
const depthAt = (x, z) => -floorY(x, z);

/* ====================================================================== *
 *  GLSL common
 * ====================================================================== */
const GLSL_COMMON = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  float a=hash12(i), b=hash12(i+vec2(1.0,0.0)), c=hash12(i+vec2(0.0,1.0)), d=hash12(i+vec2(1.0,1.0));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y); }
vec3 noised(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f); vec2 du=6.0*f*(1.0-f);
  float a=hash12(i), b=hash12(i+vec2(1.0,0.0)), c=hash12(i+vec2(0.0,1.0)), d=hash12(i+vec2(1.0,1.0));
  return vec3(a+(b-a)*u.x+(c-a)*u.y+(a-b-c+d)*u.x*u.y, du*(vec2(b-a,c-a)+(a-b-c+d)*u.yx)); }
float fbm(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(3.1,1.7); a*=0.5; } return s/0.9375; }
float fbm3(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(3.1,1.7); a*=0.5; } return s/0.875; }
vec3 voro(vec2 x){ vec2 n=floor(x), f=fract(x); float m1=8.0, m2=8.0; vec2 id=vec2(0.0);
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){ vec2 g=vec2(float(i),float(j));
    vec2 o=vec2(hash12(n+g), hash12(n+g+19.7)); vec2 r=g+o-f; float d=dot(r,r);
    if(d<m1){ m2=m1; m1=d; id=n+g; } else if(d<m2){ m2=d; } }
  return vec3(sqrt(m1), sqrt(m2)-sqrt(m1), hash12(id)); }
float bayer2(vec2 a){ a=floor(a); return fract(dot(a, vec2(0.5, a.y*0.75))); }
float bayer4(vec2 a){ return bayer2(0.5*a)*0.25 + bayer2(a); }
vec3 absorb(vec3 col, float depth, float ly){
  float path = depth/ly + depth;
  vec3 T = exp(-vec3(0.30,0.058,0.04)*path*1.12);
  vec3 scat = mix(vec3(0.10,0.62,0.64), vec3(0.0,0.27,0.56), smoothstep(1.2,4.4,depth));
  return col*T + scat*(1.0-exp(-0.4*depth))*0.55;
}
`;
const QUAD_VS = `varying vec2 vUv; void main(){ vUv = position.xy*0.5+0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

/* ---------------- full screen pass helper ---------------- */
const quadGeo = new THREE.BufferGeometry();
quadGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), 3));
const quadScene = new THREE.Scene(), quadCam = new THREE.Camera();
const quadMesh = new THREE.Mesh(quadGeo); quadMesh.frustumCulled = false; quadScene.add(quadMesh);
function runPass(mat, target) { quadMesh.material = mat; renderer.setRenderTarget(target); renderer.render(quadScene, quadCam); }
function passMat(fs, uniforms, extra) {
  return new THREE.ShaderMaterial(Object.assign({ vertexShader: QUAD_VS, fragmentShader: fs, uniforms,
    depthTest: false, depthWrite: false, blending: THREE.NoBlending }, extra || {}));
}

/* ====================================================================== *
 *  Water ripple simulation (GPU height field)
 * ====================================================================== */
const SU = { // shared uniforms
  tSim: { value: null }, uDomain: { value: new THREE.Vector4(-10, -10, 20, 20) }, uSimCell: { value: new THREE.Vector2(0.05, 0.05) },
  uTime: { value: 0 }, uSunDir: { value: SUN.clone() }, uSunW: { value: SUNW.clone() }, uSun: { value: 1 }, uRain: { value: 0 },
  tCaust: { value: null }, tShadow: { value: null }, uTargetRes: { value: new THREE.Vector2(1, 1) }, uHalfZ: { value: 8.4 },
  uCam: { value: camera.position.clone() }, uPx: { value: 500 }, uSimTexel: { value: new THREE.Vector2(1 / 440, 1 / 440) }
};
const SIM = { w: 0, h: 0, rt: [null, null], cur: 0, acc: 0, calm: 0 };
const simStepMat = passMat(`
uniform sampler2D tPrev; uniform vec2 uTexel; uniform vec4 uDomain; uniform float uCalm; varying vec2 vUv;
void main(){
  vec4 s = texture2D(tPrev, vUv);
  vec4 l = texture2D(tPrev, vUv - vec2(uTexel.x, 0.0)), r = texture2D(tPrev, vUv + vec2(uTexel.x, 0.0));
  vec4 d = texture2D(tPrev, vUv - vec2(0.0, uTexel.y)), u = texture2D(tPrev, vUv + vec2(0.0, uTexel.y));
  float avg = (l.r + r.r + d.r + u.r) * 0.25;
  float v = s.g + (avg - s.r) * 1.8;
  v *= 0.9935;
  float h = s.r + v;
  h *= 0.9993;
  float foam = mix(s.b, (l.b + r.b + d.b + u.b) * 0.25, 0.3) * 0.9885 - 0.0004;
  vec2 p = uDomain.xy + vUv * uDomain.zw;
  float de = min(min(p.x - uDomain.x, uDomain.x + uDomain.z - p.x), min(p.y - uDomain.y, uDomain.y + uDomain.w - p.y));
  float damp = mix(0.84, 1.0, smoothstep(0.0, 1.5, de)) * (1.0 - 0.07 * uCalm);
  h *= damp; v *= damp;
  gl_FragColor = vec4(h, v, max(foam, 0.0), 1.0);
}`, { tPrev: { value: null }, uTexel: { value: new THREE.Vector2() }, uDomain: SU.uDomain, uCalm: { value: 0 } });
const DROP_N = 16;
const dropMat = passMat(`
uniform sampler2D tPrev; uniform vec4 uDomain; uniform vec4 uDrops[${DROP_N}]; uniform float uFoam[${DROP_N}]; varying vec2 vUv;
void main(){
  vec4 s = texture2D(tPrev, vUv);
  vec2 p = uDomain.xy + vUv * uDomain.zw;
  for (int i = 0; i < ${DROP_N}; i++) {
    vec4 d = uDrops[i];
    if (d.z > 0.0) {
      float q = length(p - d.xy) / d.z;
      if (q < 1.0) { float b = 0.5 + 0.5 * cos(3.14159265 * q); s.r += d.w * b; s.b += uFoam[i] * b; }
    }
  }
  s.b = min(s.b, 1.6);
  gl_FragColor = s;
}`, { tPrev: { value: null }, uDomain: SU.uDomain,
  uDrops: { value: Array.from({ length: DROP_N }, () => new THREE.Vector4()) }, uFoam: { value: new Float32Array(DROP_N) } });
const dropQueue = [];
function queueDrop(x, z, r, amp, foam) { if (dropQueue.length < 160) dropQueue.push(x, z, r, amp, foam || 0); }

function initSim() {
  const dx = VIEW.halfX + 1.7, dz = VIEW.halfZ + 1.7;
  SU.uDomain.value.set(-dx, -dz, 2 * dx, 2 * dz);
  let w, h;
  if (dx >= dz) { w = 440; h = Math.max(32, Math.round(440 * dz / dx)); } else { h = 440; w = Math.max(32, Math.round(440 * dx / dz)); }
  if (SIM.w === w && SIM.h === h && SIM.rt[0]) return;
  SIM.w = w; SIM.h = h;
  for (let i = 0; i < 2; i++) {
    if (SIM.rt[i]) SIM.rt[i].dispose();
    const f = simLinear ? THREE.LinearFilter : THREE.NearestFilter;
    SIM.rt[i] = new THREE.WebGLRenderTarget(w, h, { type: simType, format: THREE.RGBAFormat, minFilter: f, magFilter: f,
      wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping, depthBuffer: false, stencilBuffer: false });
    renderer.setRenderTarget(SIM.rt[i]); renderer.setClearColor(0x000000, 0); renderer.clear(true, false, false);
  }
  renderer.setRenderTarget(null);
  SIM.cur = 0;
  SU.uSimCell.value.set(2 * dx / w, 2 * dz / h);
  simStepMat.uniforms.uTexel.value.set(1 / w, 1 / h);
  SU.tSim.value = SIM.rt[0].texture;
}
function simSwap(mat) {
  const read = SIM.rt[SIM.cur], write = SIM.rt[1 - SIM.cur];
  mat.uniforms.tPrev.value = read.texture;
  runPass(mat, write);
  SIM.cur = 1 - SIM.cur;
}
function simUpdate(dt) {
  // apply queued drops
  let i = 0;
  while (i < dropQueue.length) {
    const U = dropMat.uniforms;
    for (let k = 0; k < DROP_N; k++) {
      if (i < dropQueue.length) {
        U.uDrops.value[k].set(dropQueue[i], dropQueue[i + 1], dropQueue[i + 2], dropQueue[i + 3]); U.uFoam.value[k] = dropQueue[i + 4]; i += 5;
      } else { U.uDrops.value[k].set(0, 0, 0, 0); U.uFoam.value[k] = 0; }
    }
    simSwap(dropMat);
  }
  dropQueue.length = 0;
  SIM.acc += dt;
  let steps = 0;
  simStepMat.uniforms.uCalm.value = SIM.calm;
  while (SIM.acc >= 1 / 90 && steps < 4) { simSwap(simStepMat); SIM.acc -= 1 / 90; steps++; }

    const thr = Math.max(28, c.S.halfW * c.scale * pxPerUnit * 0.9 + 12);
    if (d < thr && d / thr < bd) { bd = d / thr; best = c; }
  }
  return best;
}

/* ====================================================================== *
 *  Interaction
 * ====================================================================== */
function tapWater(x, z) {
  queueDrop(x, z, 0.32, -0.22, 0.25);
  addRing(x, z, 0.1, 1.6, 0.06, 1.2, 0.6); addRing(x, z, 0.05, 1.0, 0.04, 1.0, 0.4);
  crown({ x, z }, 14, 0.1, 1.2, 2.4, 0.2, 0.8, 0.03, 0.05);
  SND.tap();
  for (const c of creatures) {
    if (c.state !== 'swim' || c.leaving) continue;
    const d = Math.hypot(c.pos.x - x, c.pos.z - z);
    if (d > 8) continue;
    const k = c.S.key;
    if (k === 'shark' || k === 'hammer' || k === 'dolphin' || k === 'orca') { c.attract = { x, z, t: 4.5 }; c.flee = null; if (c.mode === 'breathe' && c.spouted) c.mode = 'cruise'; }
    else if (k === 'turtle' || k === 'manta') { c.flee = { x, z, t: 3 }; c.attract = null; }
  }
}
let ptr = null;
canvas.addEventListener('pointerdown', e => {
  audioInit();
  if (ptr) return;
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
  const w = screenToPlane(e.clientX, e.clientY, 0);
  const W = WORLD.whirl;
  if (W.on && Math.hypot(w.x - W.x, w.z - W.z) < 1.8) { ptr = { id: e.pointerId, mode: 'whirl' }; return; }
  const c = pickCreature(e.clientX, e.clientY);
  if (c) { grab(c, e.clientX, e.clientY); ptr = { id: e.pointerId, mode: 'hold', c }; setHoldTarget(c, e.clientX, e.clientY); hintSeen(); return; }
  tapWater(w.x, w.z);
  ptr = { id: e.pointerId, mode: 'stir', last: w };
});
canvas.addEventListener('pointermove', e => {
  if (!ptr || ptr.id !== e.pointerId) return;
  if (ptr.mode === 'hold') setHoldTarget(ptr.c, e.clientX, e.clientY);
  else if (ptr.mode === 'whirl') { const w = screenToPlane(e.clientX, e.clientY, 0); WORLD.whirl.x = w.x; WORLD.whirl.z = w.z; }
  else if (ptr.mode === 'stir') {
    const w = screenToPlane(e.clientX, e.clientY, 0);
    const d = Math.hypot(w.x - ptr.last.x, w.z - ptr.last.z);
    if (d > 0.22) {
      const n = Math.min(8, Math.floor(d / 0.22));
      for (let i = 1; i <= n; i++) { const t = i / n; queueDrop(lerp(ptr.last.x, w.x, t), lerp(ptr.last.z, w.z, t), 0.24, -0.05, 0.08); }
      ptr.last = w;
    }
  }
});
function endPtr(e) {
  if (!ptr || ptr.id !== e.pointerId) return;
  if (ptr.mode === 'hold') releaseHeld(ptr.c);
  ptr = null;
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------- UI ---------------- */
const cardsEl = $('#cards');
const cardEls = SPECIES.map((S, i) => {
  const b = document.createElement('button');
  b.className = 'card'; b.type = 'button';
  b.title = `${S.name} — ${S.desc} (${i + 1})`;
  b.innerHTML = `<span class="k">${i + 1}</span><div class="ph"></div><div class="nm"><span class="long">${S.name}</span><span class="short">${S.short}</span></div><div class="ds">${S.desc}</div>`;
  cardsEl.appendChild(b);
  let cd = null;
  b.addEventListener('pointerdown', e => {
    audioInit(); e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ }
    cd = { id: e.pointerId, x0: e.clientX, y0: e.clientY, mode: null, c: null, sl: cardsEl.scrollLeft };
  });
  b.addEventListener('pointermove', e => {
    if (!cd || cd.id !== e.pointerId) return;
    const dx = e.clientX - cd.x0, dy = e.clientY - cd.y0;
    if (!cd.mode) {
      const overflow = cardsEl.scrollWidth > cardsEl.clientWidth + 2;
      if (overflow && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) cd.mode = 'scroll';
      else if (Math.hypot(dx, dy) > 12) {
        if (!canAdd(i)) { cd.mode = 'none'; return; }
        cd.mode = 'drag'; cd.c = spawnHeld(i, e.clientX, e.clientY);
      }
    }
    if (cd.mode === 'scroll') cardsEl.scrollLeft = cd.sl - dx;
    else if (cd.mode === 'drag' && cd.c) setHoldTarget(cd.c, e.clientX, e.clientY);
  });
  const end = (e, cancel) => {
    if (!cd || cd.id !== e.pointerId) return;
    if (cd.mode === 'drag' && cd.c) releaseHeld(cd.c);
    else if (!cd.mode && !cancel) throwFromCard(i, b);
    cd = null;
  };
  b.addEventListener('pointerup', e => end(e, false));
  b.addEventListener('pointercancel', e => end(e, true));
  b.addEventListener('click', e => e.preventDefault());
  return b;
});
const toolBtns = {};
document.querySelectorAll('.tool[data-t]').forEach(b => { toolBtns[b.dataset.t] = b; b.addEventListener('click', () => { audioInit(); tool(b.dataset.t); }); });
$('#showui').addEventListener('click', () => tool('hide'));
function tool(t) {
  if (t === 'rain') { WORLD.rainOn = !WORLD.rainOn; toast(WORLD.rainOn ? 'Rain shower' : 'Rain stops'); }
  else if (t === 'whirl') {
    const W = WORLD.whirl; W.on = !W.on;
    if (W.on) { const B = bounds(null); W.x = rand(B.x0 + 2, B.x1 - 2) * 0.5; W.z = rand(B.z0 + 2, B.z1 - 2) * 0.5; toast('Whirlpool — drag its centre to move it'); }
    else toast('Whirlpool fades');
  }
  else if (t === 'calm') { SIM.calm = 1; WORLD.rainOn = false; WORLD.whirl.on = false; CRATERS.length = 0; toast('Calm waters'); }
  else if (t === 'clear') clearAll();
  else if (t === 'sound') { setSound(!AU.on); toast(AU.on ? 'Sound on' : 'Sound off'); }
  else if (t === 'hide') { document.body.classList.toggle('hideui'); setTimeout(measureDock, 400); }
  toolBtns.rain.classList.toggle('on', WORLD.rainOn);
  toolBtns.whirl.classList.toggle('on', WORLD.whirl.on);
  toolBtns.sound.classList.toggle('on', AU.on);
}
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '7') { audioInit(); throwFromCard(+k - 1, cardEls[+k - 1]); }
  else if (e.repeat) return;
  else if (k === 'r') tool('rain'); else if (k === 'w') tool('whirl'); else if (k === 'c') tool('calm');
  else if (k === 'm') tool('sound'); else if (k === 'h') tool('hide'); else if (k === 'x') tool('clear');
  else return;
  audioInit();
});
let hintDone = false;
function hintSeen() { if (hintDone) return; hintDone = true; setTimeout(() => { $('#hint').style.opacity = '0'; }, 2500); }
setTimeout(hintSeen, 14000);
const countEl = $('#count'); let lastCount = -1;
function updateCount() {
  const n = liveCount();
  if (n !== lastCount) { lastCount = n; countEl.textContent = n + (n === 1 ? ' creature' : ' creatures'); }
  for (let i = 0; i < cardEls.length; i++) {
    const dis = n >= 24 || (i === SP.humpback && creatures.filter(c => c.sp === SP.humpback && !c.leaving).length >= 3);
    cardEls[i].classList.toggle('dis', dis);
  }
}

/* ---------------- card thumbnails rendered from the real models ---------------- */
function renderThumbs() {
  const tw = 180, th = 108;
  const rt = new THREE.WebGLRenderTarget(tw, th, { format: THREE.RGBAFormat, type: THREE.UnsignedByteType, depthBuffer: true });
  const tcam = new THREE.PerspectiveCamera(28, tw / th, 0.1, 20);
  tcam.position.set(0.0, 1.45, 1.75); tcam.lookAt(0, -0.03, 0); tcam.updateMatrixWorld();
  const scene = new THREE.Scene();
  const buf = new Uint8Array(tw * th * 4);
  const cvs = document.createElement('canvas'); cvs.width = tw; cvs.height = th;
  const c2 = cvs.getContext('2d'); const img = c2.createImageData(tw, th);
  const savedCam = SU.uCam.value.clone(); SU.uCam.value.copy(tcam.position);
  const q = new THREE.Quaternion();
  SPECIES.forEach((S, i) => {
    try {
      const g = makeInstGeo(RENDER[i].base, 1);
      quatFrom(-0.32, S.key === 'manta' ? 0.12 : 0.02, 0.3, q);
      const a = g.attributes;
      a.iPos.array.set([0, 0, 0]); a.iQuat.array.set([q.x, q.y, q.z, q.w]);
      a.iA.array.set([1.2, S.waveAmp * 0.8, 0.12, S.key === 'manta' ? 1.2 : 0.6]);
      a.iB.array.set([S.thumbS, 1, 0, S.key === 'manta' ? 0.12 : S.key === 'turtle' ? 0.25 : 0.05]);
      a.iC.array.set([0.3, 0, 0.75, S.key === 'humpback' ? 0.15 : S.flip]);
      g.instanceCount = 1;
      const m = new THREE.Mesh(g, creatureMat(i, RENDER[i].eye, 'THUMB')); m.frustumCulled = false; scene.add(m);
      renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(scene, tcam);
      renderer.readRenderTargetPixels(rt, 0, 0, tw, th, buf);
      for (let y = 0; y < th; y++) img.data.set(buf.subarray((th - 1 - y) * tw * 4, (th - y) * tw * 4), y * tw * 4);
      c2.putImageData(img, 0, 0);
      const el = document.createElement('img'); el.alt = S.name; el.draggable = false; el.src = cvs.toDataURL('image/png');
      const ph = cardEls[i].querySelector('.ph'); if (ph) ph.replaceWith(el);
      scene.remove(m); m.material.dispose();
    } catch (err) { /* thumbnails are optional */ }
  });
  SU.uCam.value.copy(savedCam);
  renderer.setRenderTarget(null); rt.dispose();
}

/* ====================================================================== *
 *  Resize / adaptive resolution
 * ====================================================================== */
const dockEl = $('#dock');
function measureDock() {
  const hidden = document.body.classList.contains('hideui');
  const r = dockEl.getBoundingClientRect();
  VIEW.dockPx = hidden ? 8 : Math.max(0, VIEW.H - r.top);
  document.documentElement.style.setProperty('--dockh', Math.round(VIEW.dockPx) + 'px');
}
function applySize() {
  renderer.setPixelRatio(VIEW.dpr);
  renderer.setSize(VIEW.W, VIEW.H, false);
  initTargets();
  const dh = renderer.getDrawingBufferSize(new THREE.Vector2()).y;
  SU.uPx.value = dh / (2 * Math.tan(camera.fov * PI / 360));
}
let floorTimer = 0;
function resize(first) {
  computeView();
  measureDock();
  VIEW.maxDpr = Math.min(window.devicePixelRatio || 1, 2);
  if (first) VIEW.dpr = Math.min(VIEW.maxDpr, VIEW.W * VIEW.H > 2.2e6 ? 1.25 : 1.6);
  VIEW.dpr = Math.min(VIEW.dpr, VIEW.maxDpr);
  applySize();
  initSim();
  SU.uHalfZ.value = VIEW.halfZ;
  surfU.uW2U.value.set(1 / (2 * VIEW.halfX), 1 / (2 * VIEW.halfZ));
  surfU.uSimTexel.value.set(1 / SIM.w, 1 / SIM.h);
  SU.uCam.value.copy(camera.position);
  clearTimeout(floorTimer);
  if (first) buildFloor(); else floorTimer = setTimeout(buildFloor, 180);
}
window.addEventListener('resize', () => resize(false));
window.addEventListener('orientationchange', () => setTimeout(() => resize(false), 200));

/* ====================================================================== *
 *  Main loop
 * ====================================================================== */
const invVP = new THREE.Matrix4();
let last = performance.now(), time = 0, perfAcc = 0, perfN = 0, slowW = 0, fastW = 0;
const AMB = { song: rand(10, 20), whistle: rand(6, 12), orca: rand(10, 18) };
function updateWorld(dt) {
  WORLD.rain = clamp(WORLD.rain + (WORLD.rainOn ? 1 : -1) * dt * 0.5, 0, 1);
  SU.uRain.value = WORLD.rain; SU.uSun.value = 1 - 0.38 * WORLD.rain;
  const W = WORLD.whirl;
  W.s = clamp(W.s + (W.on ? 1 : -1) * dt * 0.6, 0, 1);
  surfU.uWhirl.value.set(W.x, W.z, smooth(0, 1, W.s), 0);
  if (W.s > 0.05) for (let i = 0; i < 2; i++) {
    const r = rand(0.6, 4), a = rand(0, TAU);
    queueDrop(W.x + Math.cos(a) * r, W.z + Math.sin(a) * r, 0.3, -0.012 * W.s, 0.06 * W.s);
  }
  SIM.calm = Math.max(0, SIM.calm - dt * 0.6);
  if (AU.ctx && AU.rainG) AU.rainG.gain.setTargetAtTime(WORLD.rain * 0.05, AU.ctx.currentTime, 0.3);
  // occasional calls
  const has = sp => creatures.some(c => c.sp === sp && !c.leaving);
  AMB.song -= dt; AMB.whistle -= dt; AMB.orca -= dt;
  if (AMB.song <= 0) { AMB.song = rand(18, 40); if (has(SP.humpback)) SND.song(); }
  if (AMB.whistle <= 0) { AMB.whistle = rand(8, 18); if (has(SP.dolphin)) SND.whistle(); }
  if (AMB.orca <= 0) { AMB.orca = rand(14, 28); if (has(SP.orca)) SND.orca(); }
}
function render(dt) {
  simUpdate(dt);
  runPass(caustMat, caustRT);
  renderer.setRenderTarget(shadowRT); renderer.setClearColor(0x000000, 0); renderer.clear(true, false, false);
  renderer.render(shadowScene, camera);
  renderer.setRenderTarget(underRT); renderer.setClearColor(0x2a9aa6, 0.5); renderer.clear(true, true, false);
  renderer.render(underScene, camera);
  invVP.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse).invert();
  surfU.uInvVP.value.copy(invVP);
  surfU.tUnder.value = underRT.texture;
  renderer.setRenderTarget(null); renderer.setClearColor(0x000000, 1); renderer.clear(true, true, false);
  runPass(surfMat, null);
  renderer.clearDepth();
  renderer.render(overlayScene, camera);
}
function adapt(dt) {
  perfAcc += dt; perfN++;
  if (perfAcc < 1) return;
  const avg = perfAcc / perfN; perfAcc = 0; perfN = 0;
  if (avg > 1 / 42 && VIEW.dpr > 0.55) { if (++slowW >= 2) { VIEW.dpr = Math.max(0.55, VIEW.dpr * 0.82); applySize(); slowW = 0; } } else slowW = 0;
  if (avg < 1 / 57 && VIEW.dpr < VIEW.maxDpr) { if (++fastW >= 4) { VIEW.dpr = Math.min(VIEW.maxDpr, VIEW.dpr * 1.12); applySize(); fastW = 0; } } else fastW = 0;
}
function frame(now) {
  if (!running) return;
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 1 / 60; dt = Math.min(dt, 0.05);
  time += dt; SU.uTime.value = time;
  if (!(ptr && ptr.mode === 'hold') && !creatures.some(c => c.state === 'held')) marker = null;
  updateWorld(dt);
  updateCreatures(dt);
  updateParticles(dt);
  updateCraters(dt);
  writeInstances();
  updateCount();
  render(dt);
  adapt(dt);
}

/* ====================================================================== *
 *  Boot
 * ====================================================================== */
try {
  resize(true);
  renderThumbs();
  spawnSwimming(SP.dolphin); spawnSwimming(SP.dolphin); spawnSwimming(SP.turtle); spawnSwimming(SP.shark); spawnSwimming(SP.manta);
  const hb = makeCreature(SP.humpback);
  const hp = freeSpot(SP.humpback);
  hb.pos.set(hp.x, -2.0, hp.z);
  hb.yaw = Math.atan2(hp.z, -hp.x) + rand(-0.4, 0.4); // roughly toward the centre
  quatFrom(hb.yaw, 0, 0, hb.q); hb.alpha = 1; hb.speed = 1; newTarget(hb);
  hb.leapT = 1e9;
  setTimeout(() => { if (hb.state === 'swim' && creatures.includes(hb)) startRise(hb); }, 1000);
  window.__reef = { creatures, SPECIES, throwFromCard: i => throwFromCard(i, cardEls[i]), tool, VIEW, WORLD, renderer };
  requestAnimationFrame(t => { last = t; frame(t); });
} catch (err) {
  toast('Startup error: ' + (err && err.message || err), 10000);
  console.error(err);
}
})();
</script>
